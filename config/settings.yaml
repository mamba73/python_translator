project:
  name: Dynamic Book Translator
  version: 0.4.0
directories:
  work: ./work
  input: ./work/input
  output: ./work/output
  translated: ./work/translated
  audiobooks: ./work/audiobooks
  state: ./work/state
  logs: ./work/logs
  config: ./config
api:
  provider: lm_studio
  auto_detect_model: true
  auto_detect_timeout: 5
  timeout: 120
  retry_max_attempts: 3
  retry_initial_delay: 10
  retry_backoff_factor: 2
  providers:
    lm_studio:
      base_url: http://127.0.0.1:1234/v1
      model: ''
    ollama_local:
      base_url: http://127.0.0.1:11434/api
      model: llama3.2
    ollama_cloud:
      base_url: https://api.ollama.ai/v1
      model: llama3.2
      key_env: OLLAMA_API_KEY
    openai:
      base_url: https://api.openai.com/v1
      model: gpt-4o
      key_env: OPENAI_API_KEY
    gemini:
      base_url: https://generativelanguage.googleapis.com/v1beta
      model: gemini-2.0-flash
      key_env: GEMINI_API_KEY
    qwen:
      base_url: https://dashscope.aliyuncs.com/api/v1
      model: qwen-turbo
      key_env: QWEN_API_KEY
    custom:
      base_url: ''
      model: ''
      key_env: CUSTOM_API_KEY
translation:
  default_system_prompt: Ti si stručni prevoditelj s engleskog na hrvatski. Prevedi
    ovaj tekst točno i prirodno.
  temperature: 0.25
  max_tokens: 4000
  top_p: 0.8
  min_p: 0.05
  top_k: 15
  repeat_penalty: 1.2
  min_words_for_llm: 4
  min_segment_length: 10
  fallback_chunk_size: 15000
  disable_reasoning: true
  scan_pages_limit: 30
  header_footer_threshold: 0.4
  test_header: true
  granularity: paragraph
  default_count: 5
sort_mode: date_desc
text_cleaning:
  content_start_markers:
  - (?i)begin\s+(reading|of\s+book)
  - (?i)chapter\s+\d+
  - (?i)chapter\s+[a-z]
  - (?i)part\s+i+
  - (?i)prologue
  - (?i)preface
  - (?i)introduction
logging:
  verbatim: true
  llm_responses: true
  enable_reasoning: false
tts:
  engine: edge-tts
  narrator:
    voice: hr-HR-SreckoNeural
    rate: +0%
    pitch: +0Hz
  dialog:
    use_different_voice: true
    voice: hr-HR-GabrijelaNeural
    rate: +2%
    pitch: +0Hz
  dramatic_mode:
    enabled: true
    keywords_anxious:
    - run
    - explosion
    - danger
    - dead
    - weapon
    - fast
    - shot
    - kill
    - attack
    - terror
    rate_modifier_anxious: +15%
  segment:
    word_limit_soft: 500
    word_limit_hard: 600
    min_segment_words: 50
sanitization:
  replace_spaces_with: '-'
  prefix_padding: 3
chapter_patterns:
- ^(CHAPTER|Chapter|POGLAVLJE|Poglavlje)\s+\d+
- ^(EPILOGUE|PROLOGUE|Epilogue|Prologue)
- ^[A-Z\s]{4,25}$
