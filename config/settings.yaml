project:
  name: Dynamic Book Translator
  version: 0.4.0
directories:
  work: ./work
  input: ./work/input
  output: ./work/output
  translated: ./work/translated
  audiobooks: ./work/audiobooks
  state: ./work/state
  logs: ./work/logs
  config: ./config
api:
  provider: unsloth
  auto_detect_model: true
  auto_detect_timeout: 5
  timeout: 120
  retry_max_attempts: 3
  retry_initial_delay: 10
  retry_backoff_factor: 2
  model: local
translation:
  default_system_prompt: Ti si stručni prevoditelj s engleskog na hrvatski. Prevedi
    ovaj tekst točno i prirodno.
  api_parameters:
  - temperature
  - max_tokens
  - top_p
  - min_p
  - top_k
  - repeat_penalty
  - thinking_config
  temperature: 0.25
  max_tokens: 4000
  top_p: 0.8
  min_p: 0.05
  top_k: 15
  repeat_penalty: 1.2
  min_words_for_llm: 4
  min_segment_length: 10
  fallback_chunk_size: 15000
  disable_reasoning: true
  scan_pages_limit: 30
  header_footer_threshold: 0.4
  test_header: true
  granularity: max_chars
  default_count: 2
  max_chars_per_segment: 1000
  thinking_config:
    include_thinking_config: true
    thinking_level: 0
    thinking_budget: 0
fallback:
  blank_response:
    enabled: true
    policy:
    - action: reduce_prompt
      mode: compact
    - action: reduce_prompt
      mode: minimal
    - action: record
      message: MODEL VRAĆA PRAZAN STRING
sort_mode: date_desc
text_cleaning:
  content_start_markers:
  - (?i)begin\s+(reading|of\s+book)
  - (?i)chapter\s+\d+
  - (?i)chapter\s+[a-z]
  - (?i)part\s+i+
  - (?i)prologue
  - (?i)preface
  - (?i)introduction
logging:
  verbatim: true
  llm_responses: true
  enable_reasoning: false
tts:
  engine: edge-tts
  narrator:
    voice: hr-HR-SreckoNeural
    rate: +0%
    pitch: +0Hz
  dialog:
    use_different_voice: true
    voice: hr-HR-GabrijelaNeural
    rate: +0%
    pitch: +0Hz
  dramatic_mode:
    enabled: true
    keywords_anxious:
    - run
    - explosion
    - danger
    - dead
    - weapon
    - fast
    - shot
    - kill
    - attack
    - terror
    rate_modifier_anxious: +5%
  segment:
    word_limit_soft: 500
    word_limit_hard: 600
    min_segment_words: 50
sanitization:
  replace_spaces_with: '-'
  prefix_padding: 3
chapter_patterns:
- ^(CHAPTER|Chapter|POGLAVLJE|Poglavlje)\s+\d+
- ^(EPILOGUE|PROLOGUE|Epilogue|Prologue)
- ^[A-Z\s]{4,25}$
