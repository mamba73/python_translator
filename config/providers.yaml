models:
  - title: "LM Studio (Qwen3.6-27b-claude-opus-deepseek-distilled-imatrix-mtp)"
    provider: "lmstudio"
    model: "qwen3.6-27b-claude-opus-deepseek-distilled-imatrix-mtp"
    apiBase: "http://127.0.0.1:1234"

  - title: "LM Studio (localhost)"
    provider: "lmstudio"
    model: "local"
    apiBase: "http://localhost:1234/v1"

  - title: "Ollama Lokalno"
    provider: "ollama"
    model: "local"
    apiBase: "http://127.0.0.1:11434"

  - title: "Ollama Cloud"
    provider: "ollama"
    model: "local"
    apiBase: "https://ollama.ai"
    key_env: "OLLAMA_API_KEY"

  - title: "OpenAI (GPT-4o)"
    provider: "openai"
    model: "gpt-4o"
    key_env: "OPENAI_API_KEY"

  - title: "Gemini (2.0 Flash)"
    provider: "gemini"
    model: "gemini-2.0-flash"
    key_env: "GEMINI_API_KEY"

  - title: "Gemini (3.0 Flash)"
    provider: "gemini"
    model: "gemini-3-flash-preview"
