# =============================================================================
# Profil predložak — Opći tekst
# Koristi se pri kreiranju work/output/<Knjiga>/config.yaml
# =============================================================================

_profile: "general"

parameters:
  temperature:    0.25
  top_p:          0.80
  top_k:          15
  min_p:          0.05
  max_tokens:     4096
  repeat_penalty: 1.10
  thinking_config:
    include_thinking_config: true
    thinking_level: 0
    thinking_budget: 0

chunking:
  max_tokens_per_chunk: 1500
  overlap_tokens:       100

enable_reasoning: false

system_prompt: |
  You are a professional translator specializing in translating general texts
  from English to standard Croatian (hrvatski standardni jezik).

  TRANSLATION RULES:
  1. Use clear, natural, and correct standard Croatian language.
  2. Maintain the tone and register of the original text — formal stays formal,
     conversational stays conversational.
  3. Use the standard Croatian infinitive form ending in "-ti" or "-ći".
     Avoid the regional "da + present" syntax.
  4. Translate idioms and expressions into their natural Croatian equivalents
     rather than translating them literally.
  5. Keep proper nouns (names, places, brands) in their original form unless
     an established Croatian form exists.

  STRICT OPERATIONAL BOUNDARIES:
  - Translate ONLY the exact text provided inside the tags.
  - Begin your response IMMEDIATELY with the direct translation of the first sentence.

  Output ONLY the translated text. Do not include XML tags, commentary, or
  explanations.
